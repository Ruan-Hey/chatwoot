services:
  # App web
  - type: web
    name: chatwoot-web
    runtime: image
    image:
      url: docker.io/chatwoot/chatwoot:v4.2.0   # ou sha256:...    
    plan: starter     
    dockerCommand: >      
      bundle exec puma -C config/puma.rb &
      bundle exec sidekiq -C config/sidekiq.yml -c ${SIDEKIQ_CONCURRENCY:-3} &
      wait
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      # pega a URL do Redis (note o "type: redis")
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production          
