services:
  # App web
  - type: web
    name: chatwoot-web
    runtime: image
    image:
      url: docker.io/chatwoot/chatwoot:v4.2.0   # ou sha256:...
    autoDeploy: true
    plan: free 
    startCommand: >
      bash -c "
        bundle exec rails db:chatwoot_prepare &&
        bundle exec sidekiq -C config/sidekiq.yml &     # background
        exec bundle exec puma -C config/puma.rb          # foreground
      "
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      # pega a URL do Redis (note o "type: redis")
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production    
      - key: ENABLE_ACCOUNT_SIGNUP        # opcional
        value: "true"
