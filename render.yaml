services:
  # App web
  - type: web
    name: chatwoot-web
    runtime: docker
    dockerfilePath: ./Dockerfile    
    plan: starter     
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      # pega a URL do Redis (note o "type: redis")
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production       
      - key: WEB_CONCURRENCY     # 0 = 1 worker
        value: "0"
      - key: RAILS_MAX_THREADS   # ↓ reduz pool de conexões
        value: "3"
      # ↓ Sidekiq
      - key: SIDEKIQ_CONCURRENCY # padrão é 10!
        value: "2"   
